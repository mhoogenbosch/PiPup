name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    # Documentation-only changes are covered by build-docs.yml, which reports the
    # same required "build" check without compiling an APK — a readme edit should
    # not have to wait for Gradle (and for a free runner) to become mergeable.
    paths-ignore:
      - '**.md'
      - 'graphics/**'
      - '.idea/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  # Never let two runs for the same ref fight over the "build" status check; the
  # cancelled one reports a failure and blocks the pull request.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional consistent signing: set the KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD repository secrets. Without them the debug APK
      # (signed with an ephemeral debug key) is published instead.
      - name: Restore keystore
        if: ${{ vars.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Build (signed release)
        if: ${{ vars.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PiPup.apk

      - name: Build (debug)
        if: ${{ vars.HAS_KEYSTORE != 'true' }}
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PiPup.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PiPup-apk
          path: PiPup.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # the installers ship with the APK: they grant the app-ops the app cannot
          # grant itself, so a release is usable without cloning the repo
          files: |
            PiPup.apk
            install.sh
            install.ps1
