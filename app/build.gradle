apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'nl.rogro82.pipup'
    compileSdk 35

    defaultConfig {
        applicationId "nl.rogro82.pipup"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 40
        versionName "0.15.0"
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    // Consistent signing across CI builds so devices can update in place.
    // Provide a keystore via environment (see .github/workflows/build.yml);
    // release falls back to unsigned when no keystore is configured.
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Jackson pinned to 2.13.x: from 2.14.0 on, ExceptionUtil references
    // java.lang.BootstrapMethodError, which does not exist below Android API 26
    // (Oreo). On API 23-25 (e.g. Android 6.0.1 projectors) loading ObjectMapper
    // then throws NoClassDefFoundError and crashes the request thread. 2.13.5 is
    // the last line without that reference. Keep kotlin-reflect at the project's
    // Kotlin version so it matches the stdlib (module-kotlin would pull an old one).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.13.5'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // ExoPlayer (media3) — used ONLY for rtsp:// video_url. Android's stock VideoView/MediaPlayer
    // cannot reliably play RTSP (fails with MEDIA_ERROR_UNKNOWN); ExoPlayer's RTSP module can, and
    // supports TCP interleaving. Kept off the default video path (http/HLS/camera_entity stays on
    // VideoView), and the classes only load when an rtsp URL is actually shown — so no impact on
    // other popups or on Android 6 devices that never use rtsp. minSdk 21, safe for our minSdk 23.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
